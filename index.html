<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16201B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Quota">
<title>Quota · piani nutrizionali</title>

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F3F4EF; --card:#FFFFFF; --ink:#16201B; --ink2:#3E4842; --mut:#5B655F; --line:#E2E5DE; --line2:#EEF0EA; --soft:#FAFBF8; --inp:#D5DAD3;
  --green:#1E6B47; --green2:#14492F; --greenbg:#E3F0E8; --greenln:#B9D8C6;
  --blue:#2F5EA8; --orange:#D9822B; --olive:#7C8A2E; --water:#3D7FC1;
  --warn:#8A3E10; --warnbg:#FBEBDD; --warn2:#B4531A; --warnsoft:#FDF6EF;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --disp:"Space Grotesk",Inter,system-ui,sans-serif;
  --r:14px; --sat:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--green)}
h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-.02em;margin:0}
h1{font-size:28px}h2{font-size:19px}h3{font-size:16px}
.mut{color:var(--mut)}.small{font-size:12px}.b{font-weight:600}.warn{color:var(--warn)}.ok{color:var(--green)}
#app{min-height:100vh;display:flex;flex-direction:column}
#hdr{background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:12px}
#hdr .brand{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em}
#hdr .role{margin-left:auto;font-size:12px;color:#C9D0CA;background:rgba(243,244,239,.12);padding:5px 10px;border-radius:999px}
#main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:16px 16px 24px;min-width:0}
#tabs{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px 4px calc(8px + var(--sat))}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;background:transparent;color:var(--mut);font-size:11px;border-radius:10px}
#tabs button.on{color:var(--green);font-weight:600}
#tabs svg{width:22px;height:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stack>*,.grow,.two>*{min-width:0}
.card+.card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.w{flex-wrap:wrap}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;padding:11px 16px;border-radius:10px;border:1px solid var(--inp);background:var(--card);color:var(--ink);text-decoration:none;min-height:44px}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.soft{background:var(--greenbg);border-color:var(--greenln);color:var(--green2)}
.btn.ghost{background:transparent;border:1px dashed #A9B2AB;color:var(--mut)}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13px}
.btn.xs{padding:4px 9px;min-height:30px;font-size:12px;border-radius:8px}
.btn.wide{width:100%}
.btn.link{border:0;background:transparent;color:var(--green);padding:6px 0;min-height:0}
.btn.danger{color:var(--warn);border-color:#E9C9B5}
.btn:disabled{opacity:.5;cursor:default}
.inp{width:100%;padding:10px 12px;border:1px solid var(--inp);border-radius:10px;background:var(--soft);min-height:44px}
.inp.n{text-align:right;font-variant-numeric:tabular-nums}
textarea.inp{resize:vertical;min-height:70px}
label.lab{display:block;font-weight:600;margin-bottom:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--line2);color:var(--ink2)}
.chip.ok{background:var(--greenbg);color:var(--green2)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.dark{background:var(--ink);color:var(--bg)}
.pill{font-size:13px;padding:4px 9px;border-radius:8px;background:var(--bg)}
.bar{height:8px;border-radius:999px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--green)}
.bar.lg{height:10px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:13px;min-height:40px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(22,32,27,.12)}
.tabs2{display:flex;flex-wrap:wrap;gap:8px}
.tabs2 button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:40px}
.tabs2 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days7 button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);min-height:44px}
.days7 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days7 button.dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:2px}
.days7 button.on.dot::after{background:#9BD1B4}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2.end{align-items:end}
.gauto{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.num{font-family:var(--disp);font-weight:600;font-size:22px}
.num.lg{font-size:30px}
.tick{width:26px;height:26px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--green)}
.tick.mod{background:var(--warn2)}.tick.skip{background:#A9B2AB}
.tick.todo{background:transparent;border:2px solid #C9D0CA}
.tick svg{width:14px;height:14px}
.meal.next{border:2px solid var(--green)}
.hint{font-size:13px;padding:8px 10px;border-radius:10px;background:var(--bg);color:var(--ink2)}
.hint.warn{background:var(--warnsoft);color:var(--warn)}
.hint.ok{background:var(--greenbg);color:var(--green2);font-weight:600}
.list>*{padding:12px 0;border-top:1px solid var(--line2)}
.list>*:first-child{border-top:0;padding-top:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--inp);background:var(--card);font-size:20px}
.qty span{min-width:58px;text-align:center;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl .inp{min-height:36px;padding:6px 8px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cell{padding:8px 6px;border-radius:8px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.cell.off{background:var(--warnbg);color:var(--warn);font-weight:600}
.cell.todo{background:var(--card);border:1px dashed #C9D0CA;color:var(--mut)}
.clientcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);width:100%;text-align:left}
.clientcard.on{border:2px solid var(--green)}
.avatar{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#E3E7E0;display:flex;align-items:center;justify-content:center;font-weight:600}
.dist{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.dist>div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.food:first-child{border-top:0}
#sheetbg{position:fixed;inset:0;background:rgba(22,32,27,.45);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:14px 16px calc(20px + var(--sat));z-index:51;display:none;max-width:720px;margin:0 auto}
#sheet.open,#sheetbg.open{display:block}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:#C9D0CA;margin:0 auto 12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sat));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.notice{background:var(--warnsoft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.gate{max-width:440px;margin:12px auto 0}
.spinbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.inp:disabled{background:var(--bg);color:var(--mut)}
.shoprow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.cathead+.shoprow{border-top:0}
.shoprow.done .nm{text-decoration:line-through;color:var(--mut)}
.cathead{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:600;margin:14px 0 2px}
.tickbtn{border:0;background:transparent;padding:9px;margin:-9px;border-radius:50%}
select.inp{appearance:auto}
.srch{position:relative}
.srch .res{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(22,32,27,.12);max-height:280px;overflow:auto;margin-top:4px}
.srch .res button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;border-top:1px solid var(--line2)}
.srch .res button:first-child{border-top:0}
.srch .res button:hover{background:var(--soft)}
.ex{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft)}
@media(min-width:760px){
  #main{padding:24px}
  h1{font-size:30px}
  .two{display:flex;gap:20px;align-items:flex-start}
  .two>.side{flex:0 0 320px}
  .two>.grow{flex:1;min-width:0}
}
@media(max-width:480px){.g3{gap:8px}.num.lg{font-size:26px}}
</style>
</head>

// --- utilità ---
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function todayISO(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseISO(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return todayISO(d); }
function wdOf(iso) { return (parseISO(iso).getDay() + 6) % 7; }   // 0 = lunedì
function fmtDate(iso) { const d = parseISO(iso); return WD_LONG[wdOf(iso)] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function fmtShort(iso) { const d = parseISO(iso); return WD[wdOf(iso)] + ' ' + d.getDate(); }
function r0(n) { return Math.round(n || 0); }
function r1(n) { return Math.round((n || 0) * 10) / 10; }
function it1(n) { return String(r1(n)).replace('.', ','); }
function it2(n) { return (Math.round((n || 0) * 100) / 100).toFixed(2).replace(/0$/, '').replace('.', ','); }
function itK(n) { return String(r0(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function sum(arr, f) { return arr.reduce((a, x) => a + (f ? f(x) : x), 0); }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function num(v, d) { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? (d || 0) : n; }
function initials(name) { return (name || '?').split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase(); }
function timeNow() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function toMin(hhmm) { const p = (hhmm || '12:00').split(':').map(Number); return p[0] * 60 + (p[1] || 0); }

function baseFoods() {

}

// --- alimenti ---
function foodById(id) { return DB.foods.find(f => f.id === id); }
function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function searchFoods(q, limit) {
  q = norm(q).trim(); if (!q) return [];
  const toks = q.split(/\s+/);
  const scored = DB.foods.map(f => {
    const n = norm(f.name);
    let sc = 0;
    for (const t of toks) { if (n.startsWith(t)) sc += 3; else if (n.includes(' ' + t)) sc += 2; else if (n.includes(t)) sc += 1; else return null; }
    if (f.src === 'custom' || f.src === 'off') sc += 0.5;
    return { f, sc };
  }).filter(Boolean).sort((a, b) => b.sc - a.sc || a.f.name.localeCompare(b.f.name));
  return scored.slice(0, limit || 12).map(x => x.f);
}
function macrosOf(food, qty) {
  const k = (qty || 0) / 100;
  return { kcal: food.kcal * k, p: food.p * k, c: food.c * k, g: food.g * k, fib: (food.fib || 0) * k, salt: (food.salt || 0) * k };
}
function zero() { return { kcal: 0, p: 0, c: 0, g: 0, fib: 0, salt: 0 }; }
function addM(a, b, k) { k = k == null ? 1 : k; return { kcal: a.kcal + b.kcal * k, p: a.p + b.p * k, c: a.c + b.c * k, g: a.g + b.g * k, fib: (a.fib || 0) + (b.fib || 0) * k, salt: (a.salt || 0) + (b.salt || 0) * k }; }
function sumItems(items) {
  let t = zero();
  for (const it of items || []) { const f = foodById(it.foodId); if (f) t = addM(t, macrosOf(f, it.qty)); }
  return t;
}
function kcalOfMacros(m) { return (m.p || 0) * KCAL.p + (m.c || 0) * KCAL.c + (m.g || 0) * KCAL.g; }
function itemsText(items) {
  return (items || []).map(it => { const f = foodById(it.foodId); return f ? f.name + ' ' + it1(it.qty) + ' g' : '?'; }).join(', ');
}

    dayTypes: [newDayType('Giorno tipo', [0, 1, 2, 3, 4, 5, 6])]

}
function newDayType(name, days) {
  return {
    id: uid(), name: name, days: days || [], targets: { p: 150, c: 250, g: 65, salt: 5, water: 2.5 }, note: '', load: 'moderato', eee: null,
    slots: [
      { id: uid(), name: 'Colazione', time: '07:30', pct: 20, m: null, examples: [] },
      { id: uid(), name: 'Spuntino', time: '10:30', pct: 10, m: null, examples: [] },

      { id: uid(), name: 'Cena', time: '20:30', pct: 28, m: null, examples: [] }
    ]
  };
}
function dtKcal(dt) { return kcalOfMacros(dt.targets); }
function slotQuota(dt, slot, mode) {
  // quota del pasto: macro esplicite se impostate, altrimenti proporzionali alla percentuale
  const T = dt.targets;
  let m;
  if (mode === 'meals' && slot.examples && slot.examples.length) {
    const e = sumItems(slot.examples[0].items); m = { p: e.p, c: e.c, g: e.g };
  } else if (slot.m) m = { p: slot.m.p, c: slot.m.c, g: slot.m.g };
  else { const k = (slot.pct || 0) / 100; m = { p: T.p * k, c: T.c * k, g: T.g * k }; }
  return { p: m.p, c: m.c, g: m.g, kcal: kcalOfMacros(m) };
}

      if (nq !== items[best].qty) { items[best].qty = nq; changed = true; }
    }

}

// Analisi della giornata: per ogni slot quota, reale, stato; quota adattata del prossimo pasto; totali.
function dayAnalysis(plan, dt, log) {

    const q = slotQuota(dt, slot, mode);
    const e = mealEntry(log, slot);
    const logged = !!e;
    const real = mealReal(slot, e);
    const row = { slot, q, e, logged, real, verdict: null, adj: null, diffs: null };
    out.planned = addM(out.planned, { kcal: q.kcal, p: q.p, c: q.c, g: q.g, fib: 0, salt: 0 });
    if (logged) {
      out.real = addM(out.real, real);

      if (e.status === 'skipped') row.verdict = { k: 'skip', text: 'Saltato' };

        if (!offs.length) row.verdict = { k: 'ok', text: 'In linea' };

      out.plannedSoFar = { p: out.plannedSoFar.p + q.p, c: out.plannedSoFar.c + q.c, g: out.plannedSoFar.g + q.g, kcal: out.plannedSoFar.kcal + q.kcal };
    } else if (out.nextIdx < 0) {

      const changed = ['p', 'c', 'g'].filter(k => Math.abs(carry[k]) >= TOL_MIN_G);

}

function ffmOf(c) { return c.weight && c.bf > 0 ? c.weight * (1 - c.bf / 100) : null; }
function rmrCalc(c) {

  const ffm = ffmOf(c); const all = {};

  return { all, auto, pick, val: pick ? all[pick] : null, ffm };
}
function energyPlan(c) {

function planChecks(c, d, dt) {

  if (e && kcal < e.rmr.val) out.push({ k: 'warn', t: 'Calorie (' + itK(kcal) + ') sotto il metabolismo a riposo stimato (' + itK(e.rmr.val) + ' kcal).' });

function cloudDocs() {
  const docs = {};

    const ids = {}; if (S.clientId) ids[S.clientId] = 1; Object.keys(_touch).forEach(k => { ids[k] = 1; });

      if (_touch[cid] && !c.clientUid && DB.logs[cid]) Object.keys(DB.logs[cid]).forEach(iso => { docs['clients/' + cid + '/logs/' + iso] = Object.assign({}, DB.logs[cid][iso], { date: iso }); });

    b.update(FS.collection('clients').doc(d.clientId), { clientUid: user.uid, joinedAt: Date.now(), claimCode: code });
    b.update(FS.collection('invites').doc(code), { usedBy: user.uid, usedAt: Date.now() });

function clientLine(c) {
  const plan = planFor(c.id);
  if (!c.clientUid && !(DB.logs[c.id] && Object.keys(DB.logs[c.id]).length)) return { text: (plan ? 'Piano inviato' : 'Nessun piano') + " · non ha ancora l'app", warn: false, adh: '—' };
  if (!plan) return { text: 'Nessun piano inviato', warn: true, adh: '—' };
  const s = daySummary(c.id, todayISO());
  const w = weekTable(c.id, addDays(todayISO(), -1));
  const adh = w.logged ? w.inLine + '/' + w.logged : '—';
  if (!s || !s.logged) {
    // da quanti giorni non segna?
    let n = 0; for (let i = 1; i <= 14; i++) { const l = logFor(c.id, addDays(todayISO(), -i)); if (l && Object.keys(l.meals || {}).length) break; n++; }
    return { text: n >= 2 ? 'Niente segnato da ' + (n + 1) + ' giorni' : 'Niente segnato oggi', warn: n >= 2, adh };
  }
  const a = s.a;
  const mods = a.slots.filter(r => r.verdict && r.verdict.k === 'mod'), skips = a.slots.filter(r => r.verdict && r.verdict.k === 'skip');
  let t = a.loggedCount + ' di ' + a.slots.length + ' pasti';
  if (mods.length) t += ' · ' + mods.length + ' fuori quota'; if (skips.length) t += ' · ' + skips.length + ' saltat' + (skips.length > 1 ? 'i' : 'o');
  if (!mods.length && !skips.length) t += ' · tutto in linea';
  const T = a.targets;
  const warn = mods.length >= 2 || (T.water && a.water < T.water * 0.4 && toMin(timeNow()) > 15 * 60);
  return { text: t, warn, adh };
}

function monitorHtml(c) {
  const plan = planFor(c.id);
  if (!plan) return '<div class="card mut">Nessun piano inviato: il monitoraggio parte quando il cliente ha un piano.</div>';
  const iso = S.date;
  const log = logFor(c.id, iso); const dt = dayTypeFor(plan, iso, log); const a = dayAnalysis(plan, dt, log);
  const isToday = iso === todayISO();
  const nowM = toMin(timeNow());
  // previsto a quest'ora
  let expK = 0, exp = { p: 0, c: 0, g: 0 };
  a.slots.forEach(r => { if (!isToday || toMin(r.slot.time) <= nowM + 30 || r.logged) { expK += r.q.kcal; exp.p += r.q.p; exp.c += r.q.c; exp.g += r.q.g; } });
  let h = '<div class="row" style="justify-content:space-between"><button class="btn sm" onclick="S.date=addDays(S.date,-1);render()" aria-label="Giorno prima">‹</button><div style="text-align:center"><div class="b">' + fmtDate(iso) + '</div><div class="small mut">' + esc(dt.name) + (isToday ? ' · oggi' : '') + '</div></div><button class="btn sm" onclick="S.date=addDays(S.date,1);render()" aria-label="Giorno dopo"' + (isToday ? ' disabled' : '') + '>›</button></div>';
  if (!isToday) h += '<button class="btn link" style="align-self:center" onclick="S.date=todayISO();render()">Torna a oggi</button>';
  if (!a.loggedCount) h += '<div class="card mut">Niente segnato in questa giornata.</div>';
  const T = a.targets;
  const dcell = (v, t) => { const d = v - t; const off = !within(v, t); return '<span class="' + (off ? 'warn b' : 'mut') + '">' + (d >= 0 ? '+' : '−') + r0(Math.abs(d)) + '</span>'; };
  h += '<div class="gauto"><div class="card"><div class="small mut">Calorie ' + (isToday && !a.closed ? 'finora' : '') + '</div><div class="num">' + itK(a.real.kcal) + '</div><div class="small mut">' + (isToday && !a.closed ? "a quest'ora previste " : 'previste ') + itK(expK) + '</div></div>';
  h += '<div class="card"><div class="small mut">Macro ' + (isToday && !a.closed ? "a quest'ora" : '') + '</div><div class="stack" style="gap:3px;margin-top:6px;font-size:13px">' + ['p', 'c', 'g'].map(k => '<div class="row"><span>' + macroName(k)[0] + ' ' + r0(a.real[k]) + ' / ' + r0(exp[k]) + ' g</span><span class="right">' + dcell(a.real[k], exp[k]) + '</span></div>').join('') + '</div></div>';
  h += '<div class="card"><div class="small mut">Sale</div><div class="num">' + it1(a.salt) + ' g</div><div class="small mut">obiettivo ' + it1(T.salt) + ' g · ' + it1(a.saltAdded) + ' aggiunto</div></div>';
  h += '<div class="card"><div class="small mut">Acqua</div><div class="num">' + it2(a.water) + ' L</div><div class="small mut">obiettivo ' + it1(T.water) + ' L</div></div></div>';
  h += suppsMonitorHtml(c, plan, dt, log);
  // pasti
  const maxK = Math.max(1, ...a.slots.map(r => Math.max(r.q.kcal, r.real.kcal)));
  h += '<div class="card"><div class="row" style="margin-bottom:10px"><span class="b" style="font-size:15px">Pasto per pasto</span><span class="small mut right"><span style="display:inline-block;width:12px;height:8px;border-radius:2px;background:#D5DAD3"></span> quota · <span style="display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--green)"></span> mangiato</span></div><div class="list">';
  a.slots.forEach(r => {
    const s = r.slot;
    const txt = !r.logged ? '' : r.e.status === 'skipped' ? 'Saltato' : r.e.status === 'example' ? "L'esempio del piano: " + itemsText((s.examples[r.e.exIdx || 0] || {}).items) : itemsText(r.e.items);
    h += '<div class="stack" style="gap:6px"><div class="row" style="align-items:flex-start"><div class="grow"><div class="b">' + esc(s.name) + ' <span class="mut" style="font-weight:400">· ' + esc(s.time) + '</span></div><div class="small mut">' + (r.logged && r.e.at ? 'segnato alle ' + esc(r.e.at) : 'non ancora segnato') + '</div></div><div style="flex-shrink:0;text-align:right">' + (r.logged ? verdictChip(r.verdict) : '<span class="chip">Da segnare</span>') + (r.logged && r.diffs && r.e.status !== 'skipped' ? '<div class="small mut" style="margin-top:4px">P ' + fmtD(r.diffs.p) + ' · C ' + fmtD(r.diffs.c) + ' · G ' + fmtD(r.diffs.g) + '</div>' : '') + '</div></div><div class="row" style="gap:8px"><div style="height:10px;border-radius:999px;background:#D5DAD3;width:' + (r.q.kcal / maxK * 70).toFixed(0) + '%;min-width:4px;flex-shrink:0"></div><span class="small mut">quota ' + itK(r.q.kcal) + '</span></div><div class="row" style="gap:8px"><div style="height:10px;border-radius:999px;background:' + (r.verdict && r.verdict.k === 'mod' ? 'var(--warn2)' : 'var(--green)') + ';width:' + (r.logged ? (r.real.kcal / maxK * 70).toFixed(0) : 0) + '%;min-width:4px;flex-shrink:0;' + (r.logged ? '' : 'background:var(--line2)') + '"></div><span class="small b">' + (r.logged ? itK(r.real.kcal) : '—') + '</span></div>' + (txt ? '<div class="small" style="color:var(--ink2)">' + esc(txt) + '</div>' : '') + (r.logged && r.e.note ? '<div class="hint" style="padding:6px 8px">«' + esc(r.e.note) + '»</div>' : '') + '</div>';

    (id && isMine(f) ? '<button class="btn danger" onclick="foodDel()">Elimina alimento</button>' : '') + '</div>');
  if (ro) ['fe_name', 'fe_cat', 'fe_p', 'fe_c', 'fe_g', 'fe_kcal', 'fe_fib', 'fe_salt', 'fe_pn', 'fe_pg'].forEach(i => { const el = document.getElementById(i); if (el) el.disabled = true; });
  { const i = document.getElementById(ro ? 'fe_price' : f.name ? 'fe_p' : 'fe_name'); if (i) i.focus(); }
}
function feKcal() { const g = k => num(document.getElementById('fe_' + k).value); document.getElementById('fe_kcal').value = r0(kcalOfMacros({ p: g('p'), c: g('c'), g: g('g') })); }
function foodSave() {
  const g = k => num(document.getElementById('fe_' + k).value);
  const name = document.getElementById('fe_name').value.trim(); if (!name) { toast('Serve il nome'); return; }
  let f = window._foodId ? foodById(window._foodId) : null;
  if (f && !isMine(f)) { if (!DB.prices) DB.prices = {}; DB.prices[f.id] = { price: g('price') || null, pack: Math.max(0, g('pack')) }; applyPrices(); if (ME.role === 'client') shopState(ME.clientId); persist(); sheetClose(); toast('Prezzo salvato'); render(); return; }
  if (!f) { f = { id: uid(), src: 'custom', portions: [], owner: myOwner(), _t: Date.now() }; f._path = myFoodsPrefix() + '/' + f.id; DB.foods.push(f); if (window._foodPreset) { f.src = 'off'; f.barcode = window._foodPreset.barcode; f.brand = window._foodPreset.brand; } }
  Object.assign(f, { name, cat: document.getElementById('fe_cat').value, kcal: g('kcal') || r0(kcalOfMacros({ p: g('p'), c: g('c'), g: g('g') })), p: g('p'), c: g('c'), g: g('g'), fib: g('fib'), salt: g('salt'), price: g('price') || null, pack: Math.max(0, g('pack')) });
  const pn = document.getElementById('fe_pn').value.trim(), pg = num(document.getElementById('fe_pg').value);
  f.portions = pn && pg > 0 ? [{ name: pn, g: pg }] : (f.portions || []).slice(1).length ? f.portions.slice(1) : [];
  persist(); sheetClose(); toast('Alimento salvato');
  const ctx = window._foodCtx; window._foodCtx = null;
  if (ctx === 'segna') qtySheet(f, null, v => { S.edit.items.push({ foodId: f.id, qty: v }); render(); });
  else if (ctx === 'ex') qtySheet(f, null, v => { _dt().slots[S.exEdit.slot].examples[S.exEdit.ex].items.push({ foodId: f.id, qty: v }); touch(); });
  else render();
}
function foodDel() { const id = window._foodId; sheetClose(); askConfirm('Eliminare questo alimento? Nei pasti già segnati resterà come «?».', 'Elimina', () => { DB.foods = DB.foods.filter(f => f.id !== id); persist(); render(); }); }
function foodNewFrom(ctx) { const q = document.getElementById(ctx === 'segna' ? 'segSearch' : 'exSearch'); foodEditSheet(null, q ? q.value.trim() : '', ctx); }

// --- codice a barre (Open Food Facts) ---
let _bcStream = null;
function barcodeStart(ctx) {
  window._bcCtx = ctx;
  const canScan = 'BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  sheetOpen('<div class="stack"><h2>Codice a barre</h2>' + (canScan ? '<video id="bcVideo" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:260px"></video><div class="small mut" id="bcMsg">Inquadra il codice a barre…</div>' : '<div class="small mut">Questo browser non legge i codici con la fotocamera: scrivi le cifre sotto l\'etichetta.</div>') + '<div class="row"><input class="inp grow" id="bcInp" inputmode="numeric" placeholder="Cifre del codice (EAN)" onkeydown="if(event.key===\'Enter\')barcodeLookup()"><button class="btn p" onclick="barcodeLookup()">Cerca</button></div><button class="btn" onclick="barcodeStop();sheetClose()">Chiudi</button></div>');
  if (canScan) barcodeCamera();
}
async function barcodeCamera() {
  try {
    const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
    _bcStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('bcVideo'); if (!v) { barcodeStop(); return; } v.srcObject = _bcStream; await v.play();
    const tick = async () => { if (!_bcStream || !document.getElementById('bcVideo')) return; try { const codes = await det.detect(v); if (codes.length) { document.getElementById('bcInp').value = codes[0].rawValue; barcodeStop(); barcodeLookup(); return; } } catch (e) { } setTimeout(tick, 250); };
    tick();
  } catch (e) { const m = document.getElementById('bcMsg'); if (m) m.textContent = 'Fotocamera non disponibile: scrivi le cifre.'; }
}
function barcodeStop() { if (_bcStream) { _bcStream.getTracks().forEach(t => t.stop()); _bcStream = null; } }
async function barcodeLookup() {
  const code = (document.getElementById('bcInp').value || '').replace(/\D/g, ''); if (code.length < 8) { toast('Codice troppo corto'); return; }
  barcodeStop();
  const ctx = window._bcCtx;
  const have = DB.foods.find(f => f.barcode === code);
  if (have) { sheetClose(); afterBarcode(have, ctx); return; }
  document.getElementById('bcInp').disabled = true; toast('Cerco su Open Food Facts…');
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,product_name_it,brands,nutriments,serving_quantity');
    const j = await r.json();
    if (!j.product) throw new Error('nf');
    const n = j.product.nutriments || {};
    const kcal = n['energy-kcal_100g'] != null ? n['energy-kcal_100g'] : (n['energy_100g'] ? n['energy_100g'] / 4.184 : 0);
    const preset = { name: j.product.product_name_it || j.product.product_name || '', brand: j.product.brands || '', barcode: code, kcal: r0(kcal), p: r1(n.proteins_100g || 0), c: r1(n.carbohydrates_100g || 0), g: r1(n.fat_100g || 0), fib: r1(n.fiber_100g || 0), salt: r1(n.salt_100g || 0), cat: 'altro', portions: j.product.serving_quantity ? [{ name: 'porzione', g: num(j.product.serving_quantity) }] : [] };
    sheetClose(); foodEditSheet(null, preset.name, ctx === 'list' ? null : ctx, preset);
  } catch (e) { sheetClose(); toast(navigator.onLine ? 'Prodotto non trovato: crealo a mano' : 'Serve la connessione'); foodEditSheet(null, '', ctx === 'list' ? null : ctx, { barcode: code, name: '' }); }
}
function afterBarcode(f, ctx) {
  if (ctx === 'segna') qtySheet(f, null, v => { S.edit.items.push({ foodId: f.id, qty: v }); render(); });
  else if (ctx === 'ex') qtySheet(f, null, v => { _dt().slots[S.exEdit.slot].examples[S.exEdit.ex].items.push({ foodId: f.id, qty: v }); touch(); });
  else foodEditSheet(f.id);
}

// ===== AVVIO =====
document.addEventListener('click', e => { if (!e.target.closest('.srch')) document.querySelectorAll('.srch .res').forEach(r => r.hidden = true); });
boot();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { navigator.serviceWorker.register('sw.js').catch(() => { }); }
</script>
